name: Dependency security and build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Audit dependency tree
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const result = spawnSync('npm', ['audit', '--json'], { encoding: 'utf8' });
          let report;
          try {
            report = JSON.parse(result.stdout || '{}');
          } catch {
            process.stderr.write(result.stderr || 'npm audit did not return valid JSON.\n');
            process.exit(2);
          }

          const packages = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            via: (item.via || []).map((entry) => (
              typeof entry === 'string'
                ? entry
                : { name: entry.name, title: entry.title, range: entry.range, url: entry.url }
            )),
          }));

          console.log(JSON.stringify({
            counts: report.metadata?.vulnerabilities || null,
            packages,
          }, null, 2));

          if ((report.metadata?.vulnerabilities?.total || 0) > 0) {
            process.exit(1);
          }
          if (result.status !== 0) {
            process.stderr.write(result.stderr || 'npm audit returned a non-zero exit code.\n');
            process.exit(result.status || 1);
          }
          NODE
