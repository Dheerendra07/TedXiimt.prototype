name: Dependency security and build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh dependency lockfile for pull requests
        if: github.event_name == 'pull_request'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund --audit-level=low

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Audit dependency tree
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const result = spawnSync('npm', ['audit', '--json'], { encoding: 'utf8' });
          let report;
          try {
            report = JSON.parse(result.stdout || '{}');
          } catch {
            process.stderr.write(result.stderr || 'npm audit did not return valid JSON.\n');
            process.exit(2);
          }

          const packages = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            via: (item.via || []).map((entry) => (
              typeof entry === 'string'
                ? entry
                : { name: entry.name, title: entry.title, range: entry.range, url: entry.url }
            )),
          }));

          console.log(JSON.stringify({
            counts: report.metadata?.vulnerabilities || null,
            packages,
          }, null, 2));

          if ((report.metadata?.vulnerabilities?.total || 0) > 0) {
            process.exit(1);
          }
          if (result.status !== 0) {
            process.stderr.write(result.stderr || 'npm audit returned a non-zero exit code.\n');
            process.exit(result.status || 1);
          }
          NODE

      - name: Upload dependency manifests for reviewed PRs
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-manifests-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error

      - name: Commit verified dependency manifest changes to PR branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): refresh patched dependency lockfile"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
