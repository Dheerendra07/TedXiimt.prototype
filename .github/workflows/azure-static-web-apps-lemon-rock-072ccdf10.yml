name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build (runs for PRs and pushes)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: true                   # enable if you use Git LFS for images
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        run: npm ci
      - name: Lint changed homepage components (ESLint)
        run: >-
          npx eslint
          src/components/Hero.jsx
          src/components/Header.jsx
          src/components/HomeSectionHeading.jsx
          src/components/WhatIsTEDx.jsx
          src/components/FeaturedSpeakers.jsx
          src/components/EventHighlights.jsx
          src/components/ValueProposition.jsx
          src/components/SocialMedia.jsx
          src/components/Partners.jsx
          src/components/Blog.jsx
          src/components/FloatingCTA.jsx
          src/pages/HomePage.jsx
          src/Router.jsx
      - name: Build (Vite)
        run: npm run build         # ensure "build": "vite build" in package.json
      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install chromium
      - name: Start Vite production preview
        if: github.event_name == 'pull_request'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/tedx-vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tedx-vite-preview.log
          exit 1
      - name: Capture full homepage scroll states (desktop and mobile)
        if: github.event_name == 'pull_request'
        env:
          HOMEPAGE_PREVIEW_URL: http://127.0.0.1:4173/
          HOMEPAGE_ARTIFACT_DIR: artifacts/homepage
        run: node scripts/capture-homepage.cjs
      - name: Upload homepage visual QA screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-visual-qa
          path: artifacts/homepage/*
          if-no-files-found: warn
      - name: Upload build artifact for PRs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

  deploy:
    name: Deploy to Azure (only on push to main)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        run: npm ci
      - name: Build (production)
        run: npm run build
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_ROCK_072CCDF10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"          # path to your app source
          output_location: "dist"    # Vite default
